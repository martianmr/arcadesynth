# pyproject.toml

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcadesynth"
version = "1.0.1"
description = "Programmatically synthesize retro arcade sound effects"
readme = "README.md"
authors = [{ name = "C. Martin Richardson", email = "c.mart.richardson@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["arcade", "synth", "retro"]
dependencies = [
    "scipy >= 1.17.1",
    'tomli; python_version < "3.11"',
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pygame", "bumpver"]

[project.urls]
Homepage = "https://github.com/martianmr/arcadesynth"

[tool.bumpver]
current_version = "1.0.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = true
allowed_branches = "main,develop,release*"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"README.md" = [
    "{version}",
]
"src/arcadesynth/__init__.py" = [
    "{version}"
]

